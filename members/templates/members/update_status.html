{% extends 'base_dashboard.html' %}

{% block title %}Update Status - {{ member.get_full_name }}{% endblock %}

{% block dashboard_content %}
<div class="row">
    <div class="col-12">
        <h1 class="h3">Update Status for {{ member.get_full_name }}</h1>
        <p class="text-muted">Current status: <span class="badge bg-{% if member.status == 'active' %}success{% elif member.status == 'pending' %}warning{% elif member.status == 'inactive' %}secondary{% else %}danger{% endif %}">
            {{ member.status|upper }}
        </span></p>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">New Status</label>
                        <select class="form-select" name="status" required>
                            <option value="active" {% if member.status == 'active' %}selected{% endif %}>Active</option>
                            <option value="pending" {% if member.status == 'pending' %}selected{% endif %}>Pending</option>
                            <option value="inactive" {% if member.status == 'inactive' %}selected{% endif %}>Inactive</option>
                            <option value="suspended" {% if member.status == 'suspended' %}selected{% endif %}>Suspended</option>
                        </select>
                    </div>
                    <div class="d-grid gap-2 d-md-flex">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Status
                        </button>
                        <a href="{% url 'members:detail' member.member_id %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
