{% extends 'base_dashboard.html' %}

{% block title %}Edit Member - LakChogo Connect{% endblock %}

{% block dashboard_content %}
<div class="row">
    <div class="col-12">
        <h1 class="h3">Edit Member: {{ member.get_full_name }}</h1>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" name="first_name" value="{{ member.user.first_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" name="last_name" value="{{ member.user.last_name }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" class="form-control" name="phone" value="{{ member.user.phone }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" value="{{ member.user.email }}">
                        </div>
                    </div>
                    <hr>
                    <h5>Next of Kin Information</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Next of Kin Name</label>
                            <input type="text" class="form-control" name="next_of_kin_name" value="{{ member.next_of_kin_name }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Next of Kin Phone</label>
                            <input type="text" class="form-control" name="next_of_kin_phone" value="{{ member.next_of_kin_phone }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Relationship</label>
                        <input type="text" class="form-control" name="next_of_kin_relationship" value="{{ member.next_of_kin_relationship }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-control" name="status">
                            <option value="active" {% if member.status == 'active' %}selected{% endif %}>Active</option>
                            <option value="inactive" {% if member.status == 'inactive' %}selected{% endif %}>Inactive</option>
                            <option value="suspended" {% if member.status == 'suspended' %}selected{% endif %}>Suspended</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Member</button>
                    <a href="{% url 'members:detail' member.member_id %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
