{% extends 'base_dashboard.html' %}

{% block title %}QR Code - {{ meeting.title }}{% endblock %}

{% block dashboard_content %}
<div class="row">
    <div class="col-12 text-center">
        <h1 class="h3">QR Code for {{ meeting.title }}</h1>
        <p class="text-muted">Scan to check in</p>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-body text-center">
                <div class="mb-4">
                    <img src="{% url 'meetings:qr_image' meeting.id %}" 
                         alt="QR Code" 
                         style="max-width: 300px; border: 1px solid #ddd; padding: 10px; border-radius: 5px;">
                </div>
                <h5>{{ meeting.title }}</h5>
                <p><i class="fas fa-map-marker-alt"></i> {{ meeting.venue }}</p>
                <p><strong>{{ meeting.date|date:"F d, Y H:i" }}</strong></p>
                <div class="mt-3">
                    <a href="{% url 'meetings:detail' meeting.id %}" class="btn btn-secondary">Back</a>
                    <button onclick="window.print()" class="btn btn-primary">
                        <i class="fas fa-print"></i> Print
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
