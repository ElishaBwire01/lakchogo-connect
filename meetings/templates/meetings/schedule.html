{% extends 'base_dashboard.html' %}

{% block title %}Schedule Meeting - LakChogo Connect{% endblock %}

{% block dashboard_content %}
<div class="row">
    <div class="col-12">
        <h1 class="h3">Schedule Meeting</h1>
        <p class="text-muted">Schedule a new group meeting</p>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Meeting Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="title" placeholder="e.g., Monthly General Meeting" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3" placeholder="Brief description of the meeting"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date & Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control" name="date" min="{{ now }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Venue <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="venue" placeholder="e.g., Conference Room" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Agenda</label>
                        <textarea class="form-control" name="agenda" rows="4" placeholder="List agenda items..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-calendar-plus"></i> Schedule Meeting
                    </button>
                    <a href="{% url 'meetings:index' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
