{% extends 'base_dashboard.html' %}

{% block title %}Meetings - LakChogo Connect{% endblock %}

{% block dashboard_content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
            <h1 class="h3">Meetings</h1>
            <a href="{% url 'meetings:schedule' %}" class="btn btn-primary">
                <i class="fas fa-calendar-plus"></i> Schedule Meeting
            </a>
        </div>
        <p class="text-muted">Manage all group meetings</p>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <p class="text-muted">No meetings scheduled yet.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
