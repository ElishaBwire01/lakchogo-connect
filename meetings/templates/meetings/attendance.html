{% extends 'base_dashboard.html' %}

{% block title %}Attendance - {{ meeting.title }}{% endblock %}

{% block dashboard_content %}
<div class="row">
    <div class="col-12">
        <h1 class="h3">Attendance - {{ meeting.title }}</h1>
        <p class="text-muted">Record attendance for this meeting</p>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <p class="text-muted">Attendance feature coming soon. Use the admin panel for now.</p>
                <a href="{% url 'meetings:detail' meeting.id %}" class="btn btn-secondary">Back</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
