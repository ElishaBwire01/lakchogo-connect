{% extends 'base.html' %}

{% block title %}Login - LakChogo Connect{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>Login</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="login" placeholder="Username or Email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <hr>

                <div class="d-grid gap-2">
                    <a href="{% url 'socialaccount_login' 'google' %}" class="btn btn-danger">
                        <i class="fab fa-google"></i> Login with Google
                    </a>
                </div>

                <div class="mt-3 text-center">
                    <a href="{% url 'account_reset_password' %}">Forgot Password?</a>
                    <br>
                    <a href="{% url 'account_signup' %}">Create Account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
