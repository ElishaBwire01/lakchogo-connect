<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Reset Successful</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background: #d4edda; padding: 30px; border-radius: 10px; border: 1px solid #28a745;">
        <div style="text-align: center; border-bottom: 3px solid #28a745; padding-bottom: 20px;">
            <h1 style="color: #155724;">✅ Password Reset Successful</h1>
        </div>
        
        <div style="padding: 20px 0;">
            <p><strong>Dear Admin,</strong></p>
            <p>The password for the following user has been successfully reset:</p>
            
            <div style="background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 15px 0;">
                <p><strong>User:</strong> {{ user.get_full_name }}</p>
                <p><strong>Username:</strong> {{ user.username }}</p>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Phone:</strong> {{ user.phone }}</p>
                <p><strong>Time:</strong> {{ timestamp }}</p>
            </div>
            
            <p style="color: #155724; font-size: 13px;">
                <strong>✅ The user can now login with their new password.</strong>
            </p>
        </div>
    </div>
</body>
</html>
