{% extends 'base.html' %}

{% block title %}Reset Password - LakChogo Connect{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top: 80px;">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">Reset Password</h4>
            </div>
            <div class="card-body">
                <p>Enter your phone number to receive a reset code.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" name="phone" placeholder="+254712345678" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-paper-plane"></i> Send Reset Code
                    </button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'accounts:login' %}">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
