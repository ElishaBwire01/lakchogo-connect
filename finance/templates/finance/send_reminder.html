{% extends 'base_dashboard.html' %}

{% block title %}Send Payment Reminder - LakChogo Connect{% endblock %}

{% block dashboard_content %}
<div class="row">
    <div class="col-12">
        <h1 class="h3">Send Payment Reminder</h1>
        <p class="text-muted">Send a reminder to a member about pending payments</p>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Select Member <span class="text-danger">*</span></label>
                        <select class="form-select" name="member_id" required>
                            <option value="">Select Member</option>
                            {% for member in members %}
                            <option value="{{ member.member_id }}" {% if selected_member == member.member_id %}selected{% endif %}>
                                {{ member.get_full_name }} ({{ member.member_id }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select" name="category_id">
                            <option value="">All Categories</option>
                            {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message <span class="text-danger">*</span></label>
                        <textarea class="form-control" name="message" rows="4" required>Dear member, please make your payment for the due contributions. Thank you.</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Send Reminder
                    </button>
                    <a href="{% url 'finance:payment_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
