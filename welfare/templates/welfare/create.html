{% extends 'base_dashboard.html' %}

{% block title %}Create Welfare Event - LakChogo Connect{% endblock %}

{% block dashboard_content %}
<div class="row">
    <div class="col-12">
        <h1 class="h3">Create Welfare Event</h1>
        <p class="text-muted">Create a new bereavement or welfare event</p>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Member ID</label>
                        <input type="text" class="form-control" name="member_id" placeholder="LCG-0001" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Deceased Name</label>
                        <input type="text" class="form-control" name="deceased_name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Relationship</label>
                        <input type="text" class="form-control" name="relationship" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date of Death</label>
                        <input type="date" class="form-control" name="date_of_death" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Collection Target (KES)</label>
                        <input type="number" class="form-control" name="collection_target" step="0.01" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Event</button>
                    <a href="{% url 'welfare:index' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
